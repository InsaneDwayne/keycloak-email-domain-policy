# Runs after every push to main. When the push is the squash-merged release
# PR from release.yml, it tags that commit, builds it, and publishes the draft
# from release-drafter.yml with the JAR attached. Then it opens a PR that sets
# the next -SNAPSHOT version and lets it merge itself once the checks pass.
# See docs/releasing.md.
name: Publish release

on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  detect:
    name: Find release commit
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are only listed for tokens with write access.
      contents: write
      pull-requests: read
    outputs:
      version: ${{ steps.find.outputs.version }}
      next: ${{ steps.find.outputs.next }}
    steps:
      - id: find
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The PR the pushed commit came from, rather than the commit title,
          # which depends on how the squash merge was worded. Retried because
          # the API can lag a few seconds behind the push.
          for attempt in 1 2 3; do
            branch=$(gh api "repos/$REPO/commits/$GITHUB_SHA/pulls" \
              --jq '[.[] | select(.merged_at != null) | .head.ref][0] // ""')
            [[ -n "$branch" ]] && break
            sleep 10
          done
          if [[ "$branch" != bot/release-v* ]]; then
            echo "No release commit in this push."
            exit 0
          fi
          version=${branch#bot/release-v}
          echo "Release commit for v$version: $GITHUB_SHA"
          # After 1.2.3 comes 1.2.4-SNAPSHOT; after 1.2.3-rc.1 comes 1.2.3-SNAPSHOT.
          # The version actually released next is decided by the PR labels.
          if [[ "$version" == *-* ]]; then
            next="${version%%-*}-SNAPSHOT"
          else
            IFS=. read -r major minor patch <<< "$version"
            next="$major.$minor.$((patch + 1))-SNAPSHOT"
          fi
          # A PR merged while the release PR was open can raise the draft's
          # version, e.g. a feature after a patch release was started. Shown
          # on the run before the release environment is approved.
          drafted=$(gh api "repos/$REPO/releases" --jq '[.[] | select(.draft)][0].tag_name // ""')
          if [[ "$drafted" != "v$version" ]]; then
            echo "::warning::The draft release is for ${drafted:-no version}, not v$version. Check its notes before approving."
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "next=$next" >> "$GITHUB_OUTPUT"

  integration-tests:
    name: Integration tests
    needs: detect
    if: needs.detect.outputs.version != ''
    permissions:
      contents: read
    uses: ./.github/workflows/integration-tests.yml
    with:
      ref: ${{ github.sha }}

  publish:
    name: Publish v${{ needs.detect.outputs.version }}
    needs: [detect, integration-tests]
    if: needs.detect.outputs.version != ''
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
      id-token: write
      attestations: write
      pull-requests: read
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      TAG: v${{ needs.detect.outputs.version }}
      JAR: keycloak-email-domain-policy-${{ needs.detect.outputs.version }}.jar
    steps:
      # The App is on the bypass list of the tag ruleset; the default token
      # can't create v* tags.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Check the release commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          # Only a release PR opened by the App releases anything, not a
          # branch someone else named bot/release-v*.
          author=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq "[.[] | select(.head.ref == \"bot/release-$TAG\")][0].user.login // \"\"")
          if [[ "$author" != "${SLUG}[bot]" ]]; then
            echo "::error::The release PR for $TAG was opened by ${author:-nobody}, not by the release bot."
            exit 1
          fi
          pom=$(mvn -B -q -ntp help:evaluate -Dexpression=project.version -DforceStdout)
          if [[ "$pom" != "$VERSION" ]]; then
            echo "::error::The POM at $GITHUB_SHA has version $pom, not $VERSION."
            exit 1
          fi
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --silent 2>/dev/null; then
            echo "::error::Tag $TAG already exists."
            exit 1
          fi
      - name: Build and unit tests
        run: |
          mvn -B -ntp verify
          cd target && sha256sum "$JAR" > "$JAR.sha256"
      # Attestations in private repositories need GitHub Enterprise Cloud.
      - uses: actions/attest-build-provenance@v4
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: target/${{ env.JAR }}
      # Kept in case publishing fails after the tag is pushed; see docs/releasing.md.
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: |
            target/${{ env.JAR }}
            target/${{ env.JAR }}.sha256
          if-no-files-found: error
      - name: Tag the release commit
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG" "$GITHUB_SHA"
          git push origin "$TAG"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          KEYCLOAK_VERSIONS: ${{ needs.integration-tests.outputs.versions }}
        run: |
          id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq '[.[] | select(.draft)][0].id // ""')
          if [[ -z "$id" ]]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft \
              --title "$TAG" --generate-notes
            id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq "[.[] | select(.draft and .tag_name == \"$TAG\")][0].id")
          fi
          prerelease=false
          [[ "$VERSION" == *-* ]] && prerelease=true
          body=$(gh api "repos/$GITHUB_REPOSITORY/releases/$id" --jq .body)
          tested="**Tested with Keycloak:** $(jq -r 'join(", ")' <<< "$KEYCLOAK_VERSIONS")"
          [[ "$body" == *"**Tested with Keycloak:**"* ]] || body=$(printf '%s\n\n%s\n' "$body" "$tested")
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" \
            -f tag_name="$TAG" -f name="$TAG" -F prerelease="$prerelease" \
            -f body="$body" --silent
          # Attach the files while it's still a draft: a published release never
          # lacks them, and immutable releases reject assets after publishing.
          gh release upload "$TAG" --repo "$GITHUB_REPOSITORY" "target/$JAR" "target/$JAR.sha256" --clobber
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/releases/$id" -F draft=false --silent
      - name: Delete the release branch
        run: git push origin --delete "bot/release-$TAG" || true

  next-version:
    name: Open PR for ${{ needs.detect.outputs.next }}
    needs: [detect, publish]
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      NEXT: ${{ needs.detect.outputs.next }}
      BRANCH: bot/next-version-${{ needs.detect.outputs.next }}
    steps:
      # PRs opened with the default token don't start CI or the label check.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Open the PR and merge it once the checks pass
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
          mvn -B -ntp versions:set -DnewVersion="$NEXT" -DgenerateBackupPoms=false
          git commit -am "Prepare next development version $NEXT"
          git push --force origin "HEAD:refs/heads/$BRANCH"
          url=$(gh pr create --base main --head "$BRANCH" --label skip-changelog \
            --title "[Release] Prepare next development version $NEXT" \
            --body "Sets the version on \`main\` to \`$NEXT\` after releasing v$VERSION; see docs/releasing.md.")
          echo "Next version PR: $url" >> "$GITHUB_STEP_SUMMARY"
          if ! gh pr merge "$url" --auto --squash --delete-branch; then
            echo "::warning::Couldn't enable auto-merge (Settings → General → Allow auto-merge). Merge $url by hand."
          fi
