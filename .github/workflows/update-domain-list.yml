name: Update domain list

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: scripts/update-domain-list.sh
      # PRs opened with the default token don't trigger other workflows, so the
      # required CI and label checks would never run. A GitHub App token avoids
      # that; without one the PR needs an admin bypass.
      - id: app-token
        if: vars.BOT_CLIENT_ID != ''
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
          branch: bot/update-domain-list
          commit-message: "[Bot] Update disposable email domain list"
          title: "[Bot] Update disposable email domain list"
          body: Weekly refresh from disposable-email-domains/disposable-email-domains.
          labels: dependencies
