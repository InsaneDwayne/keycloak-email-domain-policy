name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Cancel superseded PR runs, but let every run on main finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # This job name is a required status check in the ruleset for main; rename it there too.
    name: Build and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Fails the job on any failing unit test.
      - run: mvn -B -ntp verify
      - uses: actions/upload-artifact@v7
        with:
          name: jar
          path: target/keycloak-email-domain-policy-*.jar
          if-no-files-found: error
          retention-days: 7
