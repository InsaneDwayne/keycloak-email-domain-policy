# Opens the release PR [Release] vX.Y.Z with one commit that sets the POM to
# X.Y.Z and, for a final release, points the install examples at it.
#
# Squash-merging the PR starts publish-release.yml: it tags the squash commit,
# publishes the release, and opens a second PR that sets the next -SNAPSHOT
# version. Squash merging puts the commit on top of main as it is then, so the
# release contains every PR merged before it, just like the draft's notes.
# See docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version, e.g. 1.2.3 or 1.2.3-rc.1. Leave empty to use the draft release's version."
        required: false
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    permissions:
      # Draft releases are only listed for tokens with write access.
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          # To release from maintenance branches later, also accept release/*.
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Run this workflow on main."
            exit 1
          fi
          if [[ -z "$VERSION" ]]; then
            VERSION=$(gh api "repos/$REPO/releases" --jq '[.[] | select(.draft)][0].tag_name // ""')
            if [[ -z "$VERSION" ]]; then
              echo "::error::There is no draft release. Enter the version to release."
              exit 1
            fi
          fi
          VERSION=${VERSION#v}
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::$VERSION is not a version like 1.2.3 or 1.2.3-rc.1."
            exit 1
          fi
          if gh api "repos/$REPO/git/ref/tags/v$VERSION" --silent 2>/dev/null; then
            echo "::error::Tag v$VERSION already exists."
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  prepare:
    name: Open release PR v${{ needs.version.outputs.version }}
    needs: version
    runs-on: ubuntu-latest
    permissions: {}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      BRANCH: bot/release-v${{ needs.version.outputs.version }}
    steps:
      # PRs opened with the default token don't start CI or the label check.
      - id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.BOT_CLIENT_ID }}
          private-key: ${{ secrets.BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ steps.app-token.outputs.token }}
      - name: Commit as the App
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: |
          id=$(gh api "/users/${SLUG}[bot]" --jq .id)
          git config user.name "${SLUG}[bot]"
          git config user.email "${id}+${SLUG}[bot]@users.noreply.github.com"
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Release commit
        run: |
          mvn -B -ntp versions:set -DnewVersion="$VERSION" -DgenerateBackupPoms=false
          # The install examples point at the newest final release, not at pre-releases.
          if [[ "$VERSION" != *-* ]]; then
            sed -i -E \
              -e "s#/releases/download/v[0-9][0-9A-Za-z.-]*/#/releases/download/v$VERSION/#g" \
              -e "s#keycloak-email-domain-policy-[0-9][0-9A-Za-z.-]*\.jar#keycloak-email-domain-policy-$VERSION.jar#g" \
              README.md examples/Dockerfile examples/docker-compose.yml
          fi
          if git diff --quiet; then
            echo "::error::main already has version $VERSION. Release another version."
            exit 1
          fi
          git commit -am "Release v$VERSION"
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          git push --force origin "HEAD:refs/heads/$BRANCH"
          # A release PR for another version is outdated now.
          gh pr list --base main --state open --json number,headRefName \
            --jq ".[] | select((.headRefName | startswith(\"bot/release-v\")) and .headRefName != \"$BRANCH\") | .number" \
            | while read -r number; do
                gh pr close "$number" --delete-branch --comment "Replaced by the release PR for v$VERSION."
              done
          url=$(gh pr list --head "$BRANCH" --state open --json url --jq '.[0].url // ""')
          if [[ -z "$url" ]]; then
            url=$(gh pr create --base main --head "$BRANCH" --label skip-changelog \
              --title "[Release] v$VERSION" \
              --body "Sets the version to \`$VERSION\`. Squash-merging it publishes the release from the resulting commit on \`main\`, including every PR merged before it. Afterwards a second PR sets the next \`-SNAPSHOT\` version; see docs/releasing.md.")
          fi
          echo "Release PR: $url" >> "$GITHUB_STEP_SUMMARY"
