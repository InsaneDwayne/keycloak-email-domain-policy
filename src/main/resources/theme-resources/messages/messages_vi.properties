error-email-domain-disposable=Vui lòng sử dụng địa chỉ email cố định. Các nhà cung cấp email tạm thời không được hỗ trợ.
error-email-domain-blocked=Không thể sử dụng địa chỉ email thuộc tên miền này.
error-email-domain-not-allowed=Không thể sử dụng địa chỉ email thuộc tên miền này. Vui lòng sử dụng một trong các tên miền được cho phép.
