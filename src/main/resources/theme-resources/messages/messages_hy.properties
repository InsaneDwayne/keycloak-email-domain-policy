error-email-domain-disposable=Խնդրում ենք օգտագործել մշտական էլ. փոստի հասցե։ Ժամանակավոր էլ. փոստի ծառայությունները չեն աջակցվում։
error-email-domain-blocked=Այս տիրույթի էլ. փոստի հասցեները չեն կարող օգտագործվել։
error-email-domain-not-allowed=Այս տիրույթի էլ. փոստի հասցեները չեն կարող օգտագործվել։ Խնդրում ենք օգտագործել թույլատրված տիրույթներից մեկը։
