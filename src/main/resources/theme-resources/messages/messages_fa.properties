error-email-domain-disposable=لطفاً از یک آدرس ایمیل دائمی استفاده کنید. ارائه‌دهندگان ایمیل موقت پشتیبانی نمی‌شوند.
error-email-domain-blocked=نمی‌توان از آدرس‌های ایمیل این دامنه استفاده کرد.
error-email-domain-not-allowed=نمی‌توان از آدرس‌های ایمیل این دامنه استفاده کرد. لطفاً از یکی از دامنه‌های مجاز استفاده کنید.
